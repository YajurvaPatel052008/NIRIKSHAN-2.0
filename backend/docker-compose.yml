services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nirikshan
      POSTGRES_PASSWORD: nirikshan
      POSTGRES_DB: nirikshan
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nirikshan -d nirikshan"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
